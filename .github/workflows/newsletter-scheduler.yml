name: Scheduled Newsletter Dispatcher

on:
  # 每 5 分鐘自動巡檢是否有到達「預定派送時間」之電子報（站長電腦關機亦會自動上架網站並寄出電子報）
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch-due-newsletters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site config
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            site.config.js

      - name: Tick Google Workspace Newsletter Scheduler
        run: |
          python3 - <<'PY'
          import json, pathlib, re, urllib.request
          raw = pathlib.Path("site.config.js").read_text(encoding="utf-8")
          m = re.search(r'"googleScriptUrl"\s*:\s*"([^"]+)"', raw)
          url = (m.group(1).strip() if m else "")
          if not url:
              print("No googleScriptUrl configured; skipping.")
              raise SystemExit(0)
          req = urllib.request.Request(
              url,
              data=json.dumps({"action": "tick_scheduled_newsletters"}).encode("utf-8"),
              headers={"Content-Type": "text/plain;charset=utf-8"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("Scheduler tick response:", resp.status, resp.read().decode("utf-8", errors="replace")[:300])
          PY
