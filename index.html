  <meta charset="UTF-8" />

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob: https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://deediao-studio.netlify.app https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self' https://script.google.com https://script.googleusercontent.com"
  />
  <title>低調走過 · Field Notes &amp; Essays</title>
  <meta name="description" content="這是一座持續成長的個人知識庫。" />
  <meta property="og:site_name" content="低調走過 · Field Notes &amp; Essays" />
  <meta property="og:title" content="低調走過 · Field Notes &amp; Essays" />
  <meta property="og:description" content="這是一座持續成長的個人知識庫。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://deediaoyeh.github.io/personal-site/assets/og-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="./rss.xml" />

  <!-- 字體載入：襯線標題 + 俐落無襯線內文 + 等寬編號（無網路時自動優雅退回系統宋體與黑體） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css?v=20261128010529" />
  <link rel="stylesheet" href="./theme.custom.css?v=20261128010529" />
</head>
<body>
  <!-- 頂部閱讀進度極細線（僅閱讀單篇文章時顯示） -->
  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>

  <div class="site-shell">
    <!-- 頂部導覽列 -->
    <header class="site-header" role="banner">
      <div class="header-inner">
        <a href="#/" class="brand-mark" id="nav-brand">
          <span class="brand-name" id="brand-name">低調走過</span>
          <span class="brand-sep" aria-hidden="true">/</span>
          <span class="brand-sub" id="brand-latin">Deediao</span>
        </a>

        <nav class="primary-nav" aria-label="主要導覽">
          <a href="#/essays" class="nav-link" data-route="essays">長文</a>
          <a href="#/notes" class="nav-link" data-route="notes">筆記</a>
          <a href="#/letters" class="nav-link" data-route="letters">電子報</a>
          <a href="#/about" class="nav-link" data-route="about">關於</a>
          <button type="button" class="icon-action" id="open-search-btn" title="搜尋知識庫 (⌘K)" aria-label="搜尋知識庫">
            <span>搜尋</span>
            <kbd class="kbd-hint">⌘K</kbd>
          </button>
          <button type="button" class="theme-toggle" id="theme-toggle-btn" title="切換晨讀 / 夜讀模式" aria-label="切換閱讀燈光">
            <span id="theme-toggle-label">夜讀</span>
          </button>
          <a href="./studio.html" class="icon-action" id="local-studio-link" hidden title="開啟離線網站編輯工作台">
            <span>編輯工作台</span>
          </a>
        </nav>
      </div>
    </header>

    <!-- 主內容區 -->
    <main id="app-main" class="site-main" tabindex="-1">
      <div class="loading-state">正在載入書齋索引⋯</div>
    </main>

    <!-- 頁尾 -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-left">
          <p class="footer-colophon" id="footer-colophon"></p>
        </div>
        <div class="footer-links" id="footer-links"></div>
      </div>
    </footer>
  </div>

  <!-- 全站知識檢索對話框（極簡索引盒，無毛玻璃炫技） -->
  <div id="search-modal" class="search-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
    <div class="search-dialog">
      <div class="search-header">
        <span id="search-modal-title" class="mono-label">ARCHIVE SEARCH · 全站檢索</span>
        <button type="button" class="text-close-btn" id="close-search-btn">關閉 ESC</button>
      </div>
      <div class="search-input-wrap">
        <input
          type="search"
          id="global-search-input"
          class="search-input"
          placeholder="輸入關鍵字、標籤或主題搜尋長文與筆記⋯"
          autocomplete="off"
        />
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- 研習與講課現場投影專屬 QR Code 對話框 -->
  <div id="qr-share-modal" class="search-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="qr-modal-heading">
    <div class="qr-modal-dialog">
      <div class="search-header">
        <span class="mono-label">LECTURE &amp; HANDOUT QR · 掃描開啟本篇講義</span>
        <button type="button" class="text-close-btn" id="close-qr-modal-btn">關閉 ESC</button>
      </div>
      <div class="qr-modal-body">
        <h3 id="qr-modal-heading" class="qr-article-title"></h3>
        <div id="qr-svg-stage" class="qr-svg-stage" aria-live="polite"></div>
        <p id="qr-url-caption" class="qr-url-caption mono-label"></p>
        <div class="qr-modal-actions">
          <button type="button" id="qr-copy-link-btn" class="utility-chip-btn">🔗 複製分享連結</button>
          <button type="button" id="qr-download-png-btn" class="utility-chip-btn is-primary">⬇ 下載 QR 圖檔 (PNG)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./site.config.js?v=20261128010529"></script>
  <script src="./qrcode.js?v=20261128010529"></script>
  <script src="./app.js?v=20261128010529"></script>
</body>
</html>
