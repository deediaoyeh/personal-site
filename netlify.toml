# Netlify 備份站設定檔 (Mirror Site Configuration)
# 公開發佈目錄僅打包正式網站，移除本機專用離線編輯器 (private_studio/ 與 studio.*) 以確保安全隔離。

[build]
  publish = "dist_public"
  command = "python3 scripts/build_content.py --bundle-public dist_public"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/theme.custom.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
