# Netlify 備份站設定檔 (Mirror Site Configuration)
# 當 GitHub 主站有任何 commit 或收到 Build Hook 通知時，Netlify 會自動執行以下建置並同步發佈。

[build]
  publish = "."
  command = "python3 scripts/build_content.py"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"
